schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: DocFinder, Java 8 desktop Swing application with an embedded HTTP search UI.
  Dependencies and build profiles are defined by pom.xml; do not add dependencies without approval.
  Follow root and scoped AGENTS.md instructions. Preserve unrelated working-tree changes.
  Planning approval is required before implementation. User acceptance is required before final delivery.
  Use Superpowers writing-plans for implementation plans and test-driven-development during execution.
  Every implementation task requires a focused test and recorded evidence before completion.
  Do not commit, merge, push, or archive an unaccepted implementation.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
